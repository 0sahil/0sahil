<svg xmlns="http://www.w3.org/2000/svg" width="880" height="240" viewBox="0 0 880 240" role="img" aria-label="Sahil. I build backends, frontends, infrastructure and AI agents.">
<style>
.small{font:500 15px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#9198a1;letter-spacing:.2px}
.big{font:700 40px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#f0f6fc;letter-spacing:-1px}
.hl{fill:#79c0ff}
.ghost{fill:none}
.foot{font:400 15px ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;fill:#9198a1}
@keyframes rot{0%{opacity:1;transform:none}21.63%{opacity:1;transform:none}25.00%{opacity:0;transform:translateY(-22px)}25.01%{opacity:0;transform:translateY(22px)}96.63%{opacity:0;transform:translateY(22px)}100%{opacity:1;transform:none}}.w{opacity:0;animation:rot 10.4s cubic-bezier(.3,.7,.2,1) infinite}.w0{opacity:1}
.b1{animation:d1 14s ease-in-out infinite alternate}.b2{animation:d2 17s ease-in-out infinite alternate}@keyframes d1{to{transform:translate(-160px,40px)}}@keyframes d2{to{transform:translate(150px,-50px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<defs>
<radialGradient id="g1"><stop offset="0" stop-color="#79c0ff" stop-opacity="0.55"/><stop offset="1" stop-color="#79c0ff" stop-opacity="0"/></radialGradient>
<radialGradient id="g2"><stop offset="0" stop-color="#d2a8ff" stop-opacity="0.55"/><stop offset="1" stop-color="#d2a8ff" stop-opacity="0"/></radialGradient>
<clipPath id="clip"><rect width="880" height="240" rx="14"/></clipPath>
<filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
</defs>
<g clip-path="url(#clip)">
<rect width="880" height="240" fill="#0d1117"/>
<g filter="url(#blur)">
<ellipse class="b1" cx="700" cy="70" rx="210" ry="120" fill="url(#g1)"/>
<ellipse class="b2" cx="560" cy="210" rx="230" ry="110" fill="url(#g2)"/>
</g></g>
<rect x="0.5" y="0.5" width="879" height="239" rx="14" fill="none" stroke="#30363d"/>
<text class="small in" x="40" y="92">Hi, I'm Sahil.</text>
<text class="big in d1" x="38" y="150">I build </text>
<text class="big w w0" x="38" y="150" style="animation-delay:0.00s"><tspan class="ghost">I build </tspan><tspan class="hl">backends</tspan></text>
<text class="big w w1" x="38" y="150" style="animation-delay:-7.80s"><tspan class="ghost">I build </tspan><tspan class="hl">frontends</tspan></text>
<text class="big w w2" x="38" y="150" style="animation-delay:-5.20s"><tspan class="ghost">I build </tspan><tspan class="hl">infrastructure</tspan></text>
<text class="big w w3" x="38" y="150" style="animation-delay:-2.60s"><tspan class="ghost">I build </tspan><tspan class="hl">AI agents</tspan></text>
<text class="foot in d2" x="40" y="194">Backend at heart · deep on DevOps · building with AI agents</text>
</svg>